name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install packages
        run: nix develop -c uv sync --frozen
      - name: Tests
        run: nix develop -c uv run pytest -q
      - name: Ruff
        run: nix develop -c bash -c "ruff check src tests && ruff format --check src tests"
      - name: basedpyright
        run: nix develop -c basedpyright
      - name: RULES.md is up to date
        run: nix develop -c uv run thesis-lint rules-doc --check
      - name: Zed extension
        run: nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy -c bash -c "cd editors/zed && cargo clippy -- -D warnings"
