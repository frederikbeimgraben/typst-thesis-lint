# Rule settings of the area "bibliography".

[rules."core.bib.urldate"]

[rules."core.bib.required-fields"]
types = [
  "article: author, title, journaltitle|journal, year|date, volume, pages",
  "book: author|editor, title, year|date, location|address, publisher",
  "incollection: author, title, editor, booktitle, year|date, location|address, publisher, pages",
  "inproceedings: author, title, booktitle, year|date, pages",
  "online: author|organization, title, year|date, url, urldate",
  "thesis: author, title, year|date, type, institution|school",
  "misc: title, year|date",
]

[rules."core.bib.cited"]

[rules."core.bib.author-present"]
fields = ["author", "editor", "organization", "institution"]

[rules."core.bib.academic-title"]
titles = ["Dr.", "Prof.", "Dipl.", "M.Sc.", "B.Sc."]

[rules."core.bib.edition-one"]
pattern = '(?i)^\s*(?:1|1\.|1st|first|erste)(?:\s|$|\.)'

[rules."core.bib.not-citable"]
domains = [
  "wikipedia.org",
  "wikibooks.org",
  "wiktionary.org",
  "britannica.com",
  "brockhaus.de",
  "duden.de",
  "enzyklo.de",
  # VL02 Folie 34: daily newspapers are not citable.
  "spiegel.de",
  "zeit.de",
  "faz.net",
  "sueddeutsche.de",
  "welt.de",
  "n-tv.de",
  "bild.de",
  "focus.de",
  "tagesschau.de",
  "stern.de",
  "handelsblatt.com",
  "taz.de",
]
fields = ["url", "howpublished"]

[rules."core.bib.duplicate"]

[rules."core.bib.doi-and-url"]

[rules."core.bib.questionable"]
# VL02 Folie 34: lecture notes and student theses are errors. The rule reports
# @unpublished entries always as a warning.
severity = "error"
types = ["unpublished"]
thesis-types = ["Seminar", "Bachelor", "Master", "Diplom"]
student-entry-types = ["mastersthesis"]
keywords = ["Skript"]
keyword-fields = ["title", "type", "howpublished", "note"]

[rules."core.bib.firstname-consistent"]

[rules."core.bib.ai-source"]
tools = ["ChatGPT", "OpenAI", "Copilot", "Gemini", "Claude", "Perplexity", "Mistral"]
name-fields = ["author", "editor"]
text-fields = ["organization", "institution", "title", "url"]

[rules."core.bib.preprint"]
markers = ["arXiv", "medRxiv", "bioRxiv", "SSRN", "ResearchGate", "10.48550"]
fields = [
  "eprinttype", "archiveprefix", "url", "doi", "journal", "journaltitle", "publisher",
  "howpublished",
]

[rules."core.bib.english"]
language-fields = ["langid", "language"]
english-values = ["english", "en", "american", "british", "usenglish", "ukenglish", "en-us", "en-gb"]
english-stopwords = [
  "the", "and", "of", "for", "with", "in", "on", "to", "a", "an", "from", "by", "is", "are",
  "towards", "using", "between", "through",
]
german-stopwords = [
  "der", "die", "das", "und", "für", "von", "zur", "zum", "mit", "des", "im", "auf", "über",
  "eine", "ein", "einer", "den", "dem", "bei", "aus",
]

[rules."core.bib.online-durable"]
types = ["online"]
archives = ["web.archive.org", "archive.today", "archive.ph", "perma.cc"]
trusted-domains = [
  "eur-lex.europa.eu",
  "health.ec.europa.eu",
  "ec.europa.eu",
  "fda.gov",
  "webstore.iec.ch",
  "iso.org",
  "din.de",
  "dinmedia.de",
]

[rules."core.bib.identifier"]
types = ["article: doi", "inproceedings: doi", "book: isbn"]

[rules."core.bib.grey-type"]
types = ["report", "techreport", "misc", "online"]
fields = ["type", "howpublished"]

[rules."core.bib.book-pages"]
types = ["book"]
