# Rule settings of the area "citation".

[rules."core.cite.quote-needs-key"]

[rules."core.cite.quote-page"]
page-pattern = 'S\.\s*\d|p\.\s*\d|pp\.|\d'

[rules."core.cite.ellipsis"]

[rules."core.cite.abstract"]

[rules."core.cite.consensus"]
phrases = [
  "in der Literatur",
  "in der Forschung",
  "herrschende Meinung",
  "h. M.",
  "h.M.",
  "allgemein anerkannt",
  "weitgehend anerkannt",
  "Konsens",
  "einhellig",
  "Einigkeit",
  "die meisten Autoren",
  "viele Autoren",
  "zahlreiche Autoren",
  "zahlreiche Studien",
  "mehrere Studien",
  "mehrere Autoren",
]
min-keys = 2

[rules."core.cite.statistics"]
pattern = '\d[\d.,]*\s*(?:%|Prozent)|\bProzentpunkt|\bStatistik(?:en)?\b|\bstatistisch\w*\s+(?:belegt|signifikant|erhoben|nachgewiesen)'

[rules."core.cite.laut-subjunctive"]
marker-pattern = '^\W*(?:Laut|Nach)\s|\blaut\s'
verbs = ["sei", "seien", "habe", "könne", "werde", "müsse"]

[rules."core.cite.ibid"]
pattern = '(?i)(?<!\w)(?:ebd\.|ebenda\b|a\.\s?a\.\s?O\.|derselbe\b)'

[rules."core.cite.ff"]
pattern = '(?<![^\W\d_])ff\.'
# VL02 Folie 128: "f." is always a warning.
f-pattern = '(?<=\d)\s*f\.(?!\w)'

[rules."core.cite.quote-share"]
max-share = 0.10

[rules."core.cite.cluster"]
# VL02 Folie 126: cite only the most important works.
max-keys = 2

[rules."core.cite.block-quote"]
max-words = 40

[rules."core.cite.secondary"]
# VL02 Folien 119, 131: a secondary citation is not allowed. Use an ignore comment
# only for a real exception.
severity = "error"
pattern = '(?i)\bzit(?:\.|iert)\s*nach\b'

[rules."core.cite.reporting-unsourced"]
signals = [
  "laut",
  "zufolge",
  "nach Ansicht",
  "nach Auffassung",
  "nach Meinung",
  "betont",
  "betonen",
  "argumentiert",
  "argumentieren",
  "stellt fest",
  "stellen fest",
  "weist darauf hin",
  "weisen darauf hin",
  "behauptet",
  "behaupten",
  "vertritt die Auffassung",
  "vertreten die Auffassung",
  "kritisiert",
  "kritisieren",
  "konstatiert",
  "konstatieren",
  "postuliert",
  "postulieren",
  "hebt hervor",
  "heben hervor",
]

[rules."core.cite.foreign-quote"]
stopwords = [
  "the", "and", "of", "is", "are", "to", "in", "for", "with", "that", "this", "it",
  "be", "on", "as", "by", "or", "not", "can", "was", "were", "which", "a", "an",
]
min-share = 0.2
min-words = 4

[rules."core.cite.software"]
# The project config gives the software and data set names, and the labels
# of a list of tools that counts as a source.
terms = []
tool-labels = []

[rules."core.plagiarism.ngram"]
n = 6

[rules."core.cite.page-required"]
# VL02 Folie 128: a page is a must in the SAT course. For a citation of a whole
# work, use an ignore comment.
page-pattern = '(?<![^\W\d_])(?:S\.|pp?\.)\s*\d'

[rules."core.cite.same-author-cluster"]

[rules."core.cite.vgl-apa"]
pattern = '(?i)(?<![^\W\d_])(?:vgl\.|siehe)\s*[(\[]?\s*$'

[rules."core.cite.indirect-intro"]
min-sentences = 2
signals = [
  "laut", "zufolge", "nach Ansicht", "nach Auffassung", "nach Meinung",
  "beschreibt", "beschreiben", "berichtet", "berichten", "zeigt", "zeigen",
  "untersucht", "untersuchen", "definiert", "definieren", "betont", "betonen",
  "argumentiert", "argumentieren", "stellt fest", "stellen fest", "behauptet", "behaupten",
  "schreibt", "schreiben", "fasst", "fassen", "fordert", "fordern", "verlangt", "verlangen",
  "regelt", "regeln", "Studie", "Autor", "Autoren", "Autorin",
  "Autorinnen",
]
